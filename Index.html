<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaDa POCs">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TaDa POCs</title>
<script src="xlsx.full.min.js"></script>
<style>
:root{--v:#7c3aed;--lav:#f3efff;--lav2:#e9e2ff;--ink:#1f1640;--mut:#6b6290;--yel:#fff6cc;--yelb:#e8c95a;--card:#fff;--bg:#f6f3ff;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--lav:#221a3d;--lav2:#2d2450;--ink:#efeaff;--mut:#a79fca;--card:#1a1430;--bg:#120d24;--yel:#3a3115;--yelb:#8a7428}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px}
.top{position:sticky;top:0;z-index:5;background:var(--v);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;font-weight:800;flex:1}
.top button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 11px;font-size:14px}
.wrap{max-width:720px;margin:0 auto;padding:12px calc(env(safe-area-inset-right) + 12px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 12px)}
.tip{background:var(--lav);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);margin-bottom:10px}
.bar input{width:100%;border:1.5px solid var(--lav2);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 13px;font-size:16px;margin-bottom:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;border:1.5px solid var(--lav2);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px}
.chip.on{background:var(--v);color:#fff;border-color:var(--v)}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(60,30,140,.08);overflow:hidden;border:1px solid var(--lav2);margin-bottom:12px}
.ch{padding:12px 14px 8px}.ch b{font-size:18px}.ch .s{color:var(--mut);font-size:13px;margin-top:2px}
.pin{background:var(--yel);border-top:1px solid var(--yelb);border-bottom:1px solid var(--yelb);padding:9px 14px;font-size:14px}
.pin .muted{color:var(--mut);font-size:12px}
.pin .r{display:flex;align-items:center;gap:8px;margin:5px 0}
.pin .l{width:92px;color:var(--mut);font-size:12px;flex:none}
.pin .val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:14px}
.mini{border:1px solid var(--yelb);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 11px;font-size:13px;flex:none}
.acts{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800;background:var(--lav2);color:var(--ink);font-size:15px}
.btn.p{background:var(--v);color:#fff;flex:1;text-align:center;text-decoration:none}
.notes{padding:0 14px 12px;display:none}.notes.on{display:block}
.notes textarea{width:100%;min-height:90px;border:1.5px solid var(--lav2);border-radius:10px;padding:9px;background:var(--bg);color:var(--ink);font-size:15px}
.empty{text-align:center;color:var(--mut);padding:40px 20px}
.empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:8px}
.lock{max-width:320px;margin:18vh auto;text-align:center;padding:0 20px}
.lock .logo{font-size:34px;font-weight:800;color:var(--v)}
.lock input{width:100%;font-size:26px;text-align:center;letter-spacing:8px;border:1.5px solid var(--lav2);border-radius:12px;padding:12px;margin:14px 0;background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:30}
.sheet.on{display:flex}
.sheet .in{background:var(--bg);width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px calc(env(safe-area-inset-left) + 16px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-right) + 16px)}
.sheet h3{margin:4px 0 12px}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
.sheet input{width:100%;border:1.5px solid var(--lav2);border-radius:10px;padding:11px;font-size:16px;background:var(--card);color:var(--ink)}
.sheet .row2{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<script src="app.js"></script>
</body>
</html>
